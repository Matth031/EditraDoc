name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos_only:
        description: "Run only test-macos (diagnostic artefacts / proof)"
        type: boolean
        default: false

jobs:
  test-and-build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos_only != true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1

      - name: Install python deps
        run: python -m pip install --upgrade pip && python -m pip install -r python/requirements.txt

      - name: Install node deps
        run: npm ci

      - name: Build geometry IIFE (tsc)
        run: npm run build:geometry

      - name: Check geometry artifact drift
        run: npm run check:geometry-artifact

      - name: Geometry contract harness (bad call must fail tsc)
        run: npm run test:geometry-contract

      - name: Build IPC contracts (tsc CJS + JSON Schema)
        run: npm run build:contracts

      - name: Check contracts artifact drift
        run: npm run check:contracts-artifact

      - name: Contracts harness (bad call must fail tsc)
        run: npm run test:contracts-contract

      - name: npm audit (high+)
        run: npm run test:audit

      - name: Verify dev assets
        run: npm run test:verify-assets

      - name: Prettier check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run unit/integration tests
        run: npm test

      - name: Run node unit tests (shape parity, libs)
        run: npm run test:node

      - name: Run electron smoke e2e
        run: xvfb-run -a npm run e2e
        env:
          ELECTRON_DISABLE_GPU: "1"

      - name: Upload Playwright test-results (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-linux
          path: app/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Build package (dir)
        run: npm run build

  # Preuve technique macOS (Python système CI — pas de runtime embarqué, pas de signature).
  test-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install python deps
        run: python -m pip install --upgrade pip && python -m pip install -r python/requirements.txt

      - name: Install node deps
        run: npm ci

      - name: Run node unit tests (shape parity, libs)
        run: npm run test:node

      - name: Run electron smoke e2e
        # Partage Python : lancements Electron enchaînés sans pause ~32s → EMFILE
        # si la soft limit FD du runner reste basse (souvent 256).
        run: |
          ulimit -n 10240
          echo "ulimit -n=$(ulimit -n)"
          npm run e2e
        env:
          ELECTRON_DISABLE_GPU: "1"

      # Preuves E2E même en échec : error-context.md, screenshots, etc.
      - name: Upload Playwright test-results (macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-macos
          path: app/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Build mac package (dir, unsigned)
        if: success()
        run: npx electron-builder --mac --dir
        env:
          # Pas de Developer ID / notarization — preuve compile uniquement.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
